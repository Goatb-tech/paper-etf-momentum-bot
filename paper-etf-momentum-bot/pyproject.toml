[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-etf-bot"
version = "0.1.0"
description = "Paper-only ETF trend and momentum research and execution runner"
requires-python = ">=3.11"

[project.scripts]
paper-etf-bot = "paper_etf_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

